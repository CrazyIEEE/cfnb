name: Auto CFNB IP Optimization

on:
  schedule:
    # cron 表达式：每 1 小时运行一次
    - cron: '0 * * * *'
  # 允许在 Actions 页面手动点击运行，方便测试
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-optimization:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 根据你的实际开发环境调整

      - name: Install dependencies
        run: pip install -r requirements.txt

      # [核心修改] 精准匹配你的三个变量名进行注入
      - name: Inject Secrets into config.json
        run: |
          jq '.CF_API_TOKEN = "${{ secrets.CF_API_TOKEN }}" | .CF_ZONE_ID = "${{ secrets.CF_ZONE_ID }}" | .CF_DNS_RECORD_NAME = "${{ secrets.CF_DNS_RECORD_NAME }}"' config.json > tmp.json
          mv tmp.json config.json

      - name: Run main script
        run: python main.py

      - name: Commit and Push changes
        # 这一步会自动把跑出来的 ip.txt (或其它变更) 推送回仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 强制暂存 ip.txt，防止被 .gitignore 拦截
          git add -f ip.txt 
          
          # 如果没有变化，不执行 commit 以免报错
          git commit -m "Auto Update CF Nodes [skip ci]" || echo "No changes to commit"
          
          # 强制覆盖推送到 main 分支
          git push origin main --force
